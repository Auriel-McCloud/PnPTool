[project]
name = "pnptool-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "pydantic-settings>=2.5",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
]

[tool.setuptools.packages.find]
include = ["app*"]
