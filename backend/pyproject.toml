[project]
name = "pnptool-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "pydantic-settings>=2.5",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Wiki-Import (22.09.2026): Word/PDF-Dokument zu Text extrahieren, bevor
    # die KI daraus Wiki-Seiten-Entwürfe ableitet. python-docx liest .docx
    # inkl. Absatz-Formatvorlagen (Heading 1/2/3 als Gliederungssignal),
    # pypdf liest reinen Text aus .pdf (keine Formatvorlagen — dort erkennt
    # die KI Kapitel nur an Textmustern).
    "python-docx>=1.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Installieren mit: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
